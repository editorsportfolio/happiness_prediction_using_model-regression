<!DOCTYPE html>
<html>
<head>
  <title>Happiness Predictor</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 60px auto; padding: 0 20px; background: #f5f5f5; }
    h1 { color: #333; }
    input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #45a049; }
    #result { margin-top: 20px; padding: 16px; background: white; border-radius: 6px; font-size: 18px; text-align: center; display: none; }
  </style>
</head>
<body>
  <h1>😊 Happiness Predictor</h1>
  <p>Enter country stats to predict happiness score</p>

  <input type="number" id="gdp" placeholder="GDP per capita (e.g. 1.2)" step="0.01">
  <input type="number" id="social" placeholder="Social support (e.g. 1.4)" step="0.01">
  <input type="number" id="health" placeholder="Health / life expectancy (e.g. 0.8)" step="0.01">
  <input type="number" id="freedom" placeholder="Freedom score (e.g. 0.5)" step="0.01">

  <button onclick="predict()">Predict Happiness</button>

  <div id="result"></div>

  <script>
    async function predict() {
      const data = {
        gdp: parseFloat(document.getElementById("gdp").value),
        social: parseFloat(document.getElementById("social").value),
        health: parseFloat(document.getElementById("health").value),
        freedom: parseFloat(document.getElementById("freedom").value)
      };
      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      const json = await res.json();
      const result = document.getElementById("result");
      result.style.display = "block";
      result.innerHTML = "Predicted Happiness Score: <strong>" + json.prediction.toFixed(2) + "</strong> / 10";
    }
  </script>
</body>
</html>
